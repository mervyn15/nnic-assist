<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>NNIC Assist</title><style>:root {
  color-scheme: light;
  font: 16px/1.5 Arial, Helvetica, sans-serif;
  color: #202020;
  background: #fff;
  --muted: #646464;
  --line: #e5e5e5;
  --nav-width: 260px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: transparent; cursor: pointer; }
button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .42; cursor: not-allowed; }
button:focus-visible, a:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid #555; outline-offset: 3px; }
a { color: inherit; text-underline-offset: 3px; }
svg { flex-shrink: 0; }
[hidden] { display: none !important; }
.sr-only, .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.app { height: 100vh; height: 100dvh; overflow: hidden; display: flex; }
main { flex: 1; min-width: 0; margin-left: var(--nav-width); height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.app.nav-closed main, .app.nav-collapsed main { margin-left: 0; }
header { height: 68px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
header > div, .header-right { display: flex; align-items: center; gap: 12px; }
header strong { font-size: 18px; font-weight: 500; color: #454545; }
.mode-label, .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #555; background: #f4f4f4; border-radius: 8px; padding: 5px 8px; white-space: nowrap; }
.sidebar { width: var(--nav-width); max-width: 86vw; position: fixed; inset: 0 auto 0 0; z-index: 30; display: flex; flex-direction: column; background: #f9f9f9; border-right: 1px solid #f0f0f0; padding: 16px 12px; overflow: auto; }
.brand, .sidebar-heading { display: flex; align-items: center; gap: 8px; padding: 0 6px 16px 12px; font-size: 16px; font-weight: 600; }
.brand b { font-weight: inherit; }
.mobile-close { margin-left: auto; }
.icon-button, .navigation-toggle, .mobile-close { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 8px; color: #555; border-radius: 10px; }
.icon-button:hover, .mobile-close:hover, .navigation-toggle:hover { background: #f0f0f0; }
.nav-item, .new-chat, .settings-link { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border-radius: 9px; padding: 11px 12px; min-height: 44px; font-size: 14px; }
.nav-item:hover, .new-chat:hover, .settings-link:hover, .history-row:hover { background: #eee; }
.nav-item.selected, .history-row.active { background: #eaeaea; }
.nav-label { color: var(--muted); font-size: 12px; padding: 12px; }
.history { flex: 1; min-height: 0; overflow: auto; margin-top: 14px; }
.history-row { display: flex; align-items: center; border-radius: 9px; }
.history-row button:first-child { flex: 1; min-width: 0; text-align: left; padding: 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.history-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-row > button:last-child { padding: 9px; color: #666; }
@media (hover: hover) and (pointer: fine) { .history-row > button:last-child { opacity: 0; } .history-row:hover > button:last-child, .history-row:focus-within > button:last-child { opacity: 1; } }
.sidebar-bottom { padding-top: 12px; }

.chat-page { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 0 24px; }
.welcome { width: 100%; max-width: 768px; align-self: center; margin-top: -68px; }
h1 { font-size: 32px; font-weight: 500; letter-spacing: -.7px; line-height: 1.3; margin: 0 0 30px; text-align: center; }
.composer { border: 1px solid var(--line); border-radius: 26px; background: #fff; box-shadow: 0 3px 12px #00000008; padding: 18px 16px 12px; }
.composer:focus-within { border-color: #bcbcbc; }
.composer textarea { display: block; resize: none; min-height: 48px; max-height: 200px; width: 100%; font-size: 16px; line-height: 1.6; border: 0; outline: 0; padding: 0 6px; background: transparent; }
.composer textarea::placeholder { color: #6d6d6d; opacity: 1; }
.composer-bottom, .composer-bottom > div { display: flex; align-items: center; gap: 8px; }
.composer-bottom { justify-content: space-between; margin-top: 9px; }
.send { margin-left: auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: #202020; color: #fff; }
.send:hover { background: #444; }
.send:disabled { opacity: 1; background: #e7e7e7; color: #999; }
.stop-square { width: 12px; height: 12px; border-radius: 2px; background: currentColor; }
.composer-caption { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 6px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.composer-caption button { flex-shrink: 0; min-height: 36px; display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 9px; color: #444; }
.composer-caption button:hover, .copy-response:hover { background: #f4f4f4; }
.attachment, .context-select { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.attachment { max-width: 100%; overflow-wrap: anywhere; padding: 4px 9px; border-radius: 8px; background: #f4f4f4; margin-bottom: 8px; }
.context-select select { border: 0; background: none; max-width: 130px; }
.has-messages { width: 100%; max-width: 816px; margin: 0 auto; flex-direction: column; justify-content: initial; }
.messages { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 4px 12px; scrollbar-width: thin; scrollbar-color: #ddd transparent; }
.message { display: flex; margin-bottom: 32px; }
.message-content { width: 100%; min-width: 0; }
.message.user { justify-content: flex-end; }
.message.user .message-content { width: fit-content; max-width: 85%; padding: 12px 20px; border-radius: 24px; background: #f4f4f4; }
.message-text { font-size: 16px; line-height: 1.82; white-space: pre-wrap; overflow-wrap: anywhere; }
.message-name { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.response-actions { display: flex; margin-top: 8px; }
.copy-response, .conversation-top button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; width: auto; color: var(--muted); border-radius: 8px; padding: 4px 6px; font-size: 12px; }
.conversation-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; font-size: 13px; color: var(--muted); }
.chat-composer { padding: 8px 0 20px; flex-shrink: 0; }
.thinking { font-size: 14px; color: var(--muted); padding: 8px 0; }
.pdf-card { display: flex; align-items: center; gap: 15px; max-width: 440px; padding: 16px; margin: 16px 0; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
.pdf-icon { min-width: 48px; height: 60px; background: #f4f4f4; color: #555; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.pdf-card strong { display: block; font-size: 14px; font-weight: 600; } .pdf-card small { font-size: 11px; color: var(--muted); }
.pdf-card > div > div { display: flex; flex-wrap: wrap; gap: 12px; }
.pdf-card a, .live-chat-link { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; font-size: 13px; }

.content-page { flex: 1; min-height: 0; overflow: auto; width: 100%; max-width: 840px; margin: 0 auto; padding: 40px 32px; }
h2 { font-size: 27px; font-weight: 500; letter-spacing: -.5px; margin: 0 0 20px; }
.page-lead, .settings-card p, .library-card p, .upload-zone p, .info-box p { font-size: 14px; line-height: 1.65; color: var(--muted); }
.settings-card, .library-card, .info-box { padding: 20px; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
.settings-card > div, .info-box { display: flex; align-items: center; gap: 12px; }
.settings-card h3, .library-card h3, .upload-zone h3 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
.settings-card > div p { margin: 0; }
.setting-badge { margin-left: auto; color: var(--muted); font-size: 12px; }
.settings-card .mode-switch { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border: 1px solid #ccc; border-radius: 18px; font-size: 14px; }
.settings-card .mode-switch[aria-pressed="true"], .settings-card .mode-switch .selected { color: #fff; background: #222; }
.danger-link, .library-card button, .text-link { display: inline-flex; align-items: center; gap: 6px; padding: 9px 0; font-size: 13px; }
.danger-link { color: #922c2c; }
.search { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
.search input { width: 100%; min-width: 0; border: 0; } .search:focus-within { outline: 2px solid #777; } .search input:focus { outline: 0; }
.library-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
.library-card small, .upload-zone small { display: block; color: var(--muted); font-size: 12px; }
.upload-zone { padding: 28px 18px; border: 1px dashed #ccc; border-radius: 14px; text-align: center; margin: 15px 0; } .upload-zone small { margin-top: 16px; }
.primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 22px; background: #222; color: #fff; padding: 10px 18px; font-size: 14px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: 90vw; width: max-content; padding: 12px 16px; border-radius: 12px; background: #222; color: #fff; display: flex; gap: 10px; align-items: center; font-size: 13px; z-index: 60; }
.scrim { display: none; }
@media(min-width:851px) { .mobile-close { display: none; } }
@media(max-width:850px) {
  main { margin-left: 0; } .scrim { display: block; position: fixed; inset: 0; background: #0004; z-index: 25; }
  header { height: 60px; padding: 0 16px; } .welcome { margin-top: -60px; } .content-page { padding: 30px 24px; }
}
@media(max-width:550px) {
  header { padding: 0 12px; } header > div { gap: 7px; } header strong { font-size: 17px; }
  .chat-page { padding: 0 15px; } .welcome h1 { font-size: 28px; margin-bottom: 24px; }
  .composer { padding: 14px 11px 9px; border-radius: 22px; } .composer-caption { gap: 8px; padding-inline: 1px; font-size: 11px; }
  .composer-caption button { font-size: 12px; min-height: 44px; padding-inline: 7px; } .icon-button, .send, .mobile-close { width: 44px; height: 44px; }
  .messages { padding-top: 15px; } .message-text { font-size: 15px; } .message.user .message-content { max-width: 90%; padding: 10px 16px; }
  .chat-composer { padding-bottom: max(8px,env(safe-area-inset-bottom)); } .content-page { padding: 24px 18px; } .library-grid { grid-template-columns: 1fr; }
  .settings-card > div { flex-wrap: wrap; } .pdf-card { padding: 13px; gap: 10px; }
}
@media(max-height:480px) { .welcome { margin-top: 0; } .welcome h1 { margin: 0 0 10px; font-size: 23px; } .chat-page:not(.has-messages) { overflow-y: auto; } }
@media(prefers-reduced-motion:reduce) { * { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }

html, body, #root { height: 100%; overflow: clip; }
.app { position: fixed; inset: 0; }
.messages { overscroll-behavior-y: contain; }
.chat-composer { flex: 0 0 auto; }
main.pages-login { min-height: 100dvh; height: 100dvh; overflow: auto; margin: 0; padding: 24px; display: grid; place-items: center; }
.pages-login form { width: min(100%,360px); } .pages-login h1 { font-size: 28px; letter-spacing: -.7px; }
.pages-login p { font-size: 14px; color: var(--muted); }
.pages-login label { display: grid; gap: 6px; margin: 16px 0; font-size: 14px; }
.pages-login input { border: 1px solid #bbb; border-radius: 10px; padding: 10px 12px; width: 100%; background: #fff; }
.pages-login button { display: flex; justify-content: center; width: 100%; margin-top: 10px; } .pages-login [role=alert] { color: #932b31; }
.source-details { font-size: 12px; overflow-wrap: anywhere; margin-top: 8px; } .source-details summary { cursor: pointer; }
.settings-card .mode-options { flex-wrap: wrap; } .mode-label[disabled] { cursor: default; }

Would you like to see the coordination checklist as a chart?`,guideNext:y?2:1}:p==="dratf"?{guideTopic:p,content:y?`Start with BOQ completeness, then examine the technical differences.

For the completeness check:
\u2022 Pass: the item is included. Record differences in quantity, specification, or scope in Remarks.
\u2022 Fail: the item is missing or marked N/A. State the missing requirement in Remarks.

Keep completeness and technical acceptance separate. An included item can still require clarification before it is technically acceptable.

For refurbishment, pay particular attention to power, earthing, cooling, cable routes, access, and handover requirements. I can consolidate these points into a PDF.`:`The refurbishment discussion is centered on technical evaluation and site readiness. The immediate priorities are to complete the BOQ comparison, resolve scope differences, and confirm the facility interfaces.

Would you like to go through the BOQ review approach?`,guideNext:y?5:4}:{guideTopic:p,content:y?`Ask for evidence that can be traced to each requirement:

\u2022 The offered configuration and a clause-by-clause compliance matrix
\u2022 Coverage and performance substantiation
\u2022 Interface control documents and responsibility boundaries
\u2022 Availability, redundancy, and recovery design
\u2022 Operational scenarios and human-machine interface details
\u2022 Proposed verification methods and acceptance test procedures

A broad compliance statement should not replace project-specific evidence. Numeric thresholds must come from the approved TOR, and operational criteria need review by the appropriate specialists.

I can organize this into a PDF review brief.`:`I would structure the A-SMGCS review around six areas:

1. Required services and operating scope
2. Surveillance coverage and performance
3. System interfaces and responsibilities
4. Displays, alerts, and operational scenarios
5. Power, network, resilience, and recovery
6. Verification, acceptance, and training

For each requirement, record the TOR clause, vendor response, evidence, review result, and any clarification. This walkthrough uses a review framework; the approved TOR remains the basis for actual acceptance.
